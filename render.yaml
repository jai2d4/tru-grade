# Render Blueprint — one-click deploy.
# In the Render dashboard: New > Blueprint > point at this repo. Render reads
# this file, provisions the web service + a free Postgres database, and wires
# them together automatically. You only have to type in your Gemini key.
databases:
  - name: tru-scouting-db
    plan: free
    databaseName: tru_scouting
    user: tru_admin

services:
  - type: web
    name: tru-scouting-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: GEMINI_API_KEY
        sync: false           # paste your key in the Render dashboard after deploy
      - key: API_KEY
        sync: false           # required in production — the app refuses to start without it (see backend/security/identity.py); set to any strong random secret
      - key: VITE_API_KEY
        sync: false           # set to the SAME value as API_KEY above — baked into the frontend bundle at build time so the deployed site can call its own API. Requires a manual re-deploy after setting (build-time only, not picked up by a running instance)
      - key: CORS_ALLOW_ORIGINS
        value: ""              # same-origin only; set an explicit comma-separated allowlist if a separate frontend origin ever calls this API directly
      - key: POSTGRES_HOST
        fromDatabase:
          name: tru-scouting-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: tru-scouting-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: tru-scouting-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: tru-scouting-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: tru-scouting-db
          property: password
      - key: APP_ENV
        value: production
      - key: ENABLE_BIOMECHANICS
        value: "true"
      - key: TRUGRADE_DEVICE
        value: auto
      - key: POSE_MODEL_PATH
        value: yolo11n-pose.pt
      - key: BALL_MODEL_PATH
        value: yolo11n.pt
