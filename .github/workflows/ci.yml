name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tru_admin
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tru_scouting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Load schema
        env:
          PGPASSWORD: test
        run: psql -h localhost -U tru_admin -d tru_scouting_test -f db/init_schema.sql

      # ubuntu-latest ships gcc and cmake, so this is a real build here even
      # though the backend treats it as optional. Without it the native/Python
      # parity suite would skip and the C++ would go untested on every PR.
      - name: Build the native core
        run: sh scripts/build_native.sh

      - name: Run tests
        env:
          GEMINI_API_KEY: test-key-not-real
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: tru_scouting_test
          POSTGRES_USER: tru_admin
          POSTGRES_PASSWORD: test
        run: pytest tests backend/tests -v

      # Production can legitimately run without the library, so the fallback is
      # a supported configuration and gets its own run rather than being assumed
      # to still work.
      - name: Run tests without the native core
        env:
          GEMINI_API_KEY: test-key-not-real
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: tru_scouting_test
          POSTGRES_USER: tru_admin
          POSTGRES_PASSWORD: test
          TRUGRADE_DISABLE_NATIVE: "1"
        run: pytest tests backend/tests -q

      # No lockfile is committed yet — run `npm install` once locally and commit
      # frontend/package-lock.json, then this can become `npm ci`.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
